[package]
name = "guild-foundry-ai"
version = "0.1.0"
description = "Guild Foundry AI — native Linux AI developer workstation (Tauri 2)"
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["tray-icon", "image-png"] }
tauri-plugin-sql = { version = "2.5.0", features = ["sqlite"] }
tauri-plugin-store = "2.5.0"
tauri-plugin-notification = "2.5.1"
tauri-plugin-clipboard-manager = "2.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = "3"
sysinfo = "0.36"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
walkdir = "2"
notify = "8"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
