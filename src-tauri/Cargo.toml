[package]
name = "guild-foundry-ai"
version = "0.1.0"
default-run = "guild-foundry-ai"
description = "Guild Foundry AI — native Linux AI developer workstation (Tauri v2)"
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["tray-icon", "image-png"] }
tauri-plugin-sql = { version = "2.5.0", features = ["sqlite"] }
tauri-plugin-store = "2.5.0"
tauri-plugin-notification = "2.5.1"
tauri-plugin-clipboard-manager = "2.4.1"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = "3"
sysinfo = "0.36"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
walkdir = "2"
notify = "8"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
pdf-extract = "0.7"
calamine = "0.24"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.36"
imap = { version = "2.4", default-features = false }
imap-proto = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "pool", "smtp-transport", "rustls-tls"] }
mail-parser = "0.11"
llama-cpp-2 = "0.1"
encoding_rs = "0.8"
whisper-rs = "0.16"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# `test` feature unlocks tauri::test (mock runtime) — used by the IPC wire
# tests in src/providers.rs to exercise the real macro-generated argument
# lookup without a GUI. Zero extra dependencies.
[dev-dependencies]
tauri = { version = "2.12.1", features = ["test"] }
